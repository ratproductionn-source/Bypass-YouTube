name: probe

# Runner availability check. Each leg is independent (fail-fast: false),
# so the ones that are supported by this account will report green while
# unsupported labels report "configuration ... is not supported".
on:
  workflow_dispatch:

jobs:
  runners:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.label }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        label:
          - ubuntu-latest
          - macos-13
          - macos-14
          - macos-15
          - macos-latest
    steps:
      - name: alive
        run: |
          echo "label: ${{ matrix.label }}"
          uname -a
          xcodebuild -version || true
